# Explicit review only. No recurring schedule, issue writes or code mutation.
name: Upstream review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  triage:
    if: github.repository != 'MadsLorentzen/ai-job-search'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fetch upstream history
        run: |
          git remote add upstream https://github.com/MadsLorentzen/ai-job-search.git
          git fetch --quiet upstream master
      - name: Review historical changes mapped to native paths
        run: python tools/upstream_triage.py --remote upstream --branch master
